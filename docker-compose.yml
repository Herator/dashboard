services:
  life-dashboard-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8000"
    volumes:
      - life-dashboard-data:/app/backend/data
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./backend

  life-dashboard-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      - life-dashboard-backend
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./frontend

volumes:
  life-dashboard-data: