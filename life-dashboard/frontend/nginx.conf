server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the backend container, so the browser never needs
    # a separate hostname/port for the API (avoids CORS entirely and lets a
    # single public hostname + Cloudflare Access policy cover everything).
    location /api/ {
        proxy_pass http://life-dashboard-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The printer camera endpoint is a live multipart/x-mixed-replace
        # MJPEG stream — nginx's default response buffering would collect
        # the whole (never-ending) stream before forwarding any of it.
        proxy_buffering off;
    }
}
